[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/daehanmigukin/gyeoldaero"
description = "find the grain of what you're learning — a terminal notebook where every note is a folder"

[workspace.dependencies]
gyeoldaero-core = { path = "crates/gyeoldaero-core" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
comrak = { version = "0.57", default-features = false }
dirs = "7.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2.0"
toml = "1.1"
unicode-normalization = "0.1"
# dev
assert_cmd = "2.2"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
