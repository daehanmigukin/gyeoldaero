[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/daehanmigukin/gyeoldaero"
description = "find the grain of what you're learning — a terminal notebook where every note is a folder"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
